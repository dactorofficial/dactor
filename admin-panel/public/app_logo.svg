<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76c6e8"/>
      <stop offset="1" stop-color="#3a86c4"/>
    </linearGradient>
    <linearGradient id="shieldR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ed0c4"/>
      <stop offset="1" stop-color="#3a9bc8"/>
    </linearGradient>
    <linearGradient id="crossFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f7fb"/>
      <stop offset="1" stop-color="#cfe3f1"/>
    </linearGradient>
    <linearGradient id="heartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0d4"/>
      <stop offset="1" stop-color="#2f9fb8"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path id="shieldShape" d="M256 10 L460 88 V230 C460 360 370 450 256 500 C142 450 52 360 52 230 V88 Z"/>
    </clipPath>
    <clipPath id="leftHalf"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="rightHalf"><rect x="256" y="0" width="256" height="512"/></clipPath>
  </defs>

  <!-- Shield -->
  <g clip-path="url(#shieldClip)">
    <rect x="0" y="0" width="256" height="512" fill="url(#shieldL)"/>
    <rect x="256" y="0" width="256" height="512" fill="url(#shieldR)"/>
  </g>
  <!-- Inner border -->
  <path d="M256 36 L438 104 V230 C438 346 358 426 256 472 C154 426 74 346 74 230 V104 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linejoin="round"/>

  <!-- Cross outline -->
  <g fill="#2b6590" stroke="#2b6590" stroke-width="6" stroke-linejoin="round">
    <rect x="205" y="112" width="102" height="265" rx="24"/>
    <rect x="115" y="190" width="282" height="100" rx="24"/>
  </g>
  <!-- Cross fill -->
  <g fill="url(#crossFill)">
    <rect x="215" y="122" width="82" height="245" rx="16"/>
    <rect x="125" y="200" width="262" height="80" rx="16"/>
  </g>

  <!-- Stethoscope tubes (dark outline + light core) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2b6590" stroke-width="18">
      <path d="M212 110 C185 130 172 160 178 200 C182 225 215 240 240 262"/>
      <path d="M298 110 C325 130 340 160 334 200 C330 225 297 240 272 262"/>
      <path d="M256 285 V365 C256 420 300 440 335 425 C355 415 362 395 362 369"/>
    </g>
    <g stroke="#a9d6ee" stroke-width="7">
      <path d="M212 110 C185 130 172 160 178 200 C182 225 215 240 240 262"/>
      <path d="M298 110 C325 130 340 160 334 200 C330 225 297 240 272 262"/>
      <path d="M256 285 V365 C256 420 300 440 335 425 C355 415 362 395 362 369"/>
    </g>
  </g>

  <!-- Earpieces -->
  <circle cx="212" cy="98" r="12" fill="#2b6590"/>
  <circle cx="298" cy="98" r="12" fill="#2b6590"/>

  <!-- Chest piece -->
  <circle cx="362" cy="347" r="24" fill="#a9d6ee" stroke="#2b6590" stroke-width="9"/>

  <!-- Heart -->
  <path d="M256 285 C225 262 212 245 212 228 C212 213 224 203 237 203 C246 203 253 208 256 214 C259 208 266 203 275 203 C288 203 300 213 300 228 C300 245 287 262 256 285 Z"
        fill="url(#heartFill)" stroke="#2b6590" stroke-width="7" stroke-linejoin="round"/>
</svg>
