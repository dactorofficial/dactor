<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dactor - Page Not Found (404)</title>
    <link rel="icon" type="image/png" href="./app_logo.png" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // Dynamic detection: Keep 1 segment if hosted at username.github.io/dactor/, 0 for root domain
      var isProjectDomain = window.location.hostname.endsWith('github.io') && (window.location.pathname.startsWith('/dactor') || window.location.pathname === '/dactor');
      var pathSegmentsToKeep = isProjectDomain ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 500px;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      h1 { font-size: 32px; margin-bottom: 8px; color: #38bdf8; }
      p { font-size: 16px; color: #94a3b8; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 28px;
        background: #0284c7;
        color: #ffffff;
        text-decoration: none;
        border-radius: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="card">
        <h1>404 • Page Not Found</h1>
        <p>The page or healthcare link you were looking for does not exist or has moved.</p>
        <a href="./">Return to Dactor Home</a>
      </div>
    </noscript>
  </body>
</html>
