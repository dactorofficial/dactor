<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dactor - Nepal's Realtime Healthcare OPD Queue & Diagnostic Ecosystem</title>
    <meta name="description" content="Connect with doctors, clinics, polyclinics, and diagnostic labs in Nepal. Track active live OPD queue tokens, book appointment slots, order tests, and download lab reports." />
    <meta name="theme-color" content="#10b981" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white font-sans">
    <div id="root"></div>

    <!-- Firebase Web SDK (project: dactor-ea1e1) -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged
      } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "AIzaSyCc1ho812HhFLO3-XeNcDT_1Y68BdpzObU",
        authDomain: "dactor-ea1e1.firebaseapp.com",
        projectId: "dactor-ea1e1",
        storageBucket: "dactor-ea1e1.firebasestorage.app",
        messagingSenderId: "429529188002",
        appId: "1:429529188002:web:cd7cf4e561779910ab79fb",
        measurementId: "G-9SK7JVV6XM"
      };

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        window.dactorFirebase = {
          app,
          auth,
          googleProvider,
          initialized: true,
          signInWithGoogle: async () => {
            return await signInWithPopup(auth, googleProvider);
          },
          signOut: async () => {
            return await signOut(auth);
          },
          onAuthStateChanged: (cb) => {
            return onAuthStateChanged(auth, cb);
          }
        };
      } catch (err) {
        console.warn('Firebase initialization notice:', err);
        window.dactorFirebase = { initialized: false, error: String(err) };
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
